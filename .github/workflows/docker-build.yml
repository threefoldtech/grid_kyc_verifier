name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Every image is published under both names while deployments move over.
  # The repository was renamed from tf-kyc-verifier to grid_kyc_verifier;
  # existing deployments pull ghcr.io/threefoldtech/tf-kyc-verifier, new ones
  # should use ghcr.io/threefoldtech/grid_kyc_verifier. Drop the old name once
  # nothing pulls it any more.
  IMAGE_NAMES: threefoldtech/tf-kyc-verifier threefoldtech/grid_kyc_verifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Only the labels are used; the tags come from the next step.
          images: ${{ env.REGISTRY }}/threefoldtech/grid_kyc_verifier

      - name: Generate tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            SUFFIXES="${VERSION} latest"
          else
            SHA=$(git rev-parse --short HEAD)
            SUFFIXES="edge-${SHA} edge-latest"
          fi
          TAGS=""
          for image in $IMAGE_NAMES; do
            for suffix in $SUFFIXES; do
              TAGS="${TAGS:+$TAGS,}${REGISTRY}/${image}:${suffix}"
            done
          done
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
